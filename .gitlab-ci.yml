# Change pip's cache directory to be inside the project directory since we can
# only cache local items.
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

# Cache wheels build by pip between job runs
cache:
  paths:
  - .cache/pip
  key: "$CI_JOB_NAME"

# Build the Sphinx HTML documentation
build:docs:
  image: as-01gitlab01l.as.bs.dlr.de:5550/sp/docker-registry/python:3.11
  tags: ['linux']
  stage: build
  script:
  - python3 -m pip install .[dev]
  - make docs
  artifacts:
    paths:
    - docs/_build

test:tests:
  image: as-01gitlab01l.as.bs.dlr.de:5550/sp/docker-registry/python:3.11
  tags: ['linux']
  stage: test
  script:
  - python3 -m pip install .[dev]
  - python -m pytest -v --junitxml=report.xml --cov=python_boilerplate tests
  artifacts:
    reports:
      junit: report.xml


test:lint:
  image: as-01gitlab01l.as.bs.dlr.de:5550/sp/docker-registry/python:3.11
  tags: ['linux']
  stage: test
  allow_failure: true
  script:
  - python3 -m pip install .[dev]
  - make lint

pages:
  rules:
  - if: '$CI_COMMIT_BRANCH == "main"'
  image: as-01gitlab01l.as.bs.dlr.de:5550/sp/docker-registry/python:3.11
  tags: ['linux']
  stage: deploy
  script:
  - mv docs/_build/html public
  artifacts:
    paths:
    - public
